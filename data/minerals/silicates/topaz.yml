  palette_keywords: [golden-orange, pale-blue, champagne]
  aesthetic_roles: [gemstone, collector, prestige]
  vibe_notes: High-specular orthorhombic prism; basal cleavage reflects light in sheets.

practical_notes:
  toxicity: non-toxic (F is locked in crystal structure)
  handling_notes: Perfect basal cleavage makes setting and cutting tricky; avoid impacts on c-face
  care_notes: Avoid ultrasonic; avoid thermal shock; some blue topaz is irradiated (stable)
  treatments_or_synthetics: >
    Almost all blue topaz is irradiation-treated (safe and stable). Imperial topaz occasionally
    heat-treated. Synthetic topaz uncommon.
  common_confusions: [yellow sapphire (heavier), citrine (softer), aquamarine (different system)]
  market_notes: Imperial topaz from Ouro Preto commands premium; natural blue and pink topaz also valuable.

