  essential_elements: [Cu, C, O, H]
  trace_elements_common: [Fe, Zn, Mn]
  structural_units: copper hydroxycarbonate (two phases)
  atomic_structure_notes: >
    Azurite and malachite are two stable copper carbonate hydroxides. They coexist
    because azurite slowly converts to malachite (malachite is thermodynamically more
    stable at lower CO2 fugacity). The conversion creates pseudomorph fronts.
  chemistry_notes: >
    Azurite: Cu3(CO3)2(OH)2 — deep blue; converts to malachite with time/H2O.
    The reaction-diffusion front where azurite converts to malachite is directly
    visible as a blue-to-green gradient in specimens.

crystallography:
  crystal_system: monoclinic (both phases)
  crystal_class: 2/m (both)
  space_group: P21/c (azurite), P21/a (malachite)
  unit_cell_notes: null
  twinning: malachite: polysynthetic twinning (silky sheen)
  crystallography_notes: >
    Azurite forms tabular crystals; malachite forms fibrous aggregates or botryoidal.
    The azurite-to-malachite conversion creates sharp reaction fronts visible in slabs.

