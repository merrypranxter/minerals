  structural_units: carbonate with Ca in 9-fold coordination
  atomic_structure_notes: >
    Orthorhombic polymorph of CaCO3; Ca in 9-fold coordination vs 6-fold in calcite.
    High-pressure stable; metastable at surface P,T; converts to calcite over time.
  chemistry_notes: >
    Biogenic aragonite = nacre (mother of pearl), coral skeleton, mollusk shells.
    Sr substitutes freely for Ca; Sr/Ca ratio used in palaeoclimate studies.

