  crystal_system: orthorhombic
  crystal_class: 2/m 2/m 2/m
  space_group: Pmcn
  unit_cell_notes: a=4.96, b=7.97, c=5.74 Å
  twinning: cyclic (trillings) producing hexagonal pseudo-symmetry; common
  crystallography_notes: >
    Characteristic pseudohexagonal trillings (three crystals at 60°). Flos ferri = branching
    aragonite coralloidal aggregates; "sputnik" = radiating acicular forms.

