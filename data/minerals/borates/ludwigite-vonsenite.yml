  structural_units: oxyboron with iron-magnesium chains
  atomic_structure_notes: >
    Orthorhombic with (Fe,Mg)O6 octahedral chains parallel to c-axis linked by BO4
    groups. The c-axis fiber direction controls chatoyancy and Kajiya-Kay anisotropy.
    Vonsenite = Fe2+-Fe3+ end member; ludwigite = Mg-Fe3+ end member.
  chemistry_notes: >
    Ferro-magnesian oxyborate. Vonsenite (Fe2+2Fe3+BO5) is ferrimagnetic — the
    crystals are magnetic. The Mg-Fe series is complete.

