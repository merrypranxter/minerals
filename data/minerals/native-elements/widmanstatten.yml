  simplified_formula: "Fe7Ni to Fe3Ni"
  essential_elements: [Fe, Ni]
  trace_elements_common: [Co, Ir, Pt, Pd, Au, Ga, Ge]
  structural_units: bcc kamacite lamellae in fcc taenite host
  atomic_structure_notes: >
    Kamacite (bcc, low-Ni) exsolves from taenite (fcc, high-Ni) during slow cooling
    over millions of years in space. Lamellae oriented along {111} of the original
    parent taenite — the octahedral planes of the cubic crystal.
  chemistry_notes: >
    Widmanstätten pattern forms only at cooling rates <1°C per million years — impossible
    on Earth. Definitive proof of extraterrestrial origin. PGEs (Ir, Pt) in trace amounts.

crystallography:
  crystal_system: isometric
  crystal_class: 4/m 3-bar 2/m
  space_group: Im3m (kamacite), Fm3m (taenite)
  unit_cell_notes: null
  twinning: not applicable (exsolution texture)
  crystallography_notes: >
    Pattern is a macroscopic exsolution texture, not a crystal form. Lamellae thickness
    varies from <0.2mm (finest octahedrites) to >5mm (coarsest).

