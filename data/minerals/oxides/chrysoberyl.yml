  vibe_notes: "Chrysoberyl is a mineral of precision optical effects. The cat's eye has the sharpest, most dramatic single chatoyant band in the mineral kingdom — like a slit pupil of light across a polished dome. Alexandrite is the master color-changer, making daylight and candlelight feel like two different stones."

practical_notes:
  toxicity: low
  handling_notes: "Durable gemstone; safe for everyday wear in jewelry. Beryllium content is negligible hazard in polished form — concern only with dust from cutting/grinding."
  care_notes: "Highly resistant to chemicals and scratching. Safe to clean with warm soapy water or ultrasonic (avoid if fracture-filled). No special storage requirements."
  treatments_or_synthetics:
    - "Flux-grown synthetic alexandrite available (Chatham, Kyocera, others)"
    - "Hydrothermal synthetic alexandrite produced commercially"
    - "Fracture filling uncommon but occurs in lower-grade material"
    - "Synthetic color-change corundum (sapphire) frequently sold as alexandrite — verify by RI and inclusions"
  common_confusions:
    - "synthetic color-change corundum (sapphire) — most common mislabeled 'alexandrite'"
    - "color-change garnet — similar effect, different RI"
    - "green tourmaline — similar color but no change"
    - "demantoid garnet — similar brilliance"
    - "other cat's eye gems (quartz, apatite, tourmaline) — less sharp band than chrysoberyl"
  market_notes: "Fine alexandrite is one of the world's rarest and most expensive gemstones. Russian alexandrites (from original Ural deposit) are extremely rare and command the highest premiums. Brazilian alexandrites are the main commercial source. Fine cat's eye chrysoberyl is also rare and valuable; the best Sri Lankan specimens are highly collected."

