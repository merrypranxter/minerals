  essential_elements: [Ca, S, O, H]
  trace_elements_common: [Sr, Mg, Al]
  structural_units: chain sulfate with water layers
  atomic_structure_notes: >
    Monoclinic structure with Ca in triangular dodecahedral coordination, SO4 tetrahedra,
    and H2O layers. Selenite = transparent cleavage sheets; satin spar = fibrous;
    alabaster = granular; desert rose = lenticular crystals.
  chemistry_notes: Selenite is from Greek "selene" (moon) — not related to selenium.

crystallography:
  crystal_system: monoclinic
  crystal_class: 2/m
  space_group: A2/a
  unit_cell_notes: a=5.68, b=15.18, c=6.29 Å, β=118.43°
  twinning: swallow-tail (contact twin on {100}) and spear (penetration twin)
  crystallography_notes: >
    Perfect cleavage {010}; good cleavage {100} and {011}. Swallow-tail twins are
    diagnostic. Desert rose = platy lenticular crystals with sand inclusions.

